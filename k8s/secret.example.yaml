# Template only — DO NOT commit a populated copy.
# Apply once with real values:
#   stringData fields below get base64-encoded by the API server.
#
# JWT_PRIVATE_KEY_PEM   : RSA private key in PEM format. blog_be signs JWTs with this;
#                         verifiers (gateway, future services) fetch the public key from
#                         /.well-known/jwks.json (no shared secret).
#                         Generate with:
#                           openssl genrsa -out priv.pem 2048
#                         Then paste the full content of priv.pem (BEGIN / END lines included).
#                         Rotate by replacing this value AND bumping JWT_KID in the ConfigMap.
# ADMIN_PASSWORD_HASH   : bcrypt hash; generate via:
#                           python -c "from app.core.security.password import hash_password; print(hash_password('your-pw'))"
# DATABASE_URL          : must match POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB in postgres secret
#                         and the in-cluster service name `postgres.blog.svc.cluster.local`.
# GATEWAY_SHARED_SECRET : must equal gateway's APP_CONFIG_SECURITY_GATEWAY_SHARED_SECRET.
#                         Backend timing-safe compares the X-Gateway-Auth header (hop check in server.py).
#                         Must be set in prod; if empty the legacy compatibility path bypasses verification.
#                         Generate with: `openssl rand -hex 32`
apiVersion: v1
kind: Secret
metadata:
  name: blog-app-secret
  namespace: blog
  labels:
    app.kubernetes.io/name: blog-app
    app.kubernetes.io/part-of: blog
type: Opaque
stringData:
  # Paste the multi-line PEM here — keep the literal `-----BEGIN PRIVATE KEY-----`
  # and `-----END PRIVATE KEY-----` lines exactly as `openssl` emits them.
  JWT_PRIVATE_KEY_PEM: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME_with_the_full_PEM_body
    -----END PRIVATE KEY-----
  ADMIN_PASSWORD_HASH: "REPLACE_ME_bcrypt_hash"
  DATABASE_URL: "postgresql+asyncpg://blog:REPLACE_ME_password@postgres.blog.svc.cluster.local:5432/blog"
  GATEWAY_SHARED_SECRET: "REPLACE_ME_gateway_shared_secret_same_as_api-gateway-secret"
