# Default-deny in the namespace, then explicit allows.
# `app-ingress` permits the Gateway data plane to reach the app.
# Currently: self-operated Spring Cloud Gateway (ns `api-service`).
# When switching to a different Gateway API implementation, update the namespace label below:
#   Envoy Gateway: envoy-gateway-system / Istio: istio-system /
#   kgateway: kgateway-system / nginx-gateway-fabric: nginx-gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: blog
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# App is reached from the Gateway data plane.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-ingress
  namespace: blog
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blog-app
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api-service
      ports:
        - port: 8080
          protocol: TCP
---
# App egress: postgres + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-egress
  namespace: blog
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blog-app
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Migration / seed Jobs need the same egress as the app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobs-egress
  namespace: blog
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["blog-migrate", "blog-seed"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Postgres is reachable from app + jobs + backup, on 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: blog
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: blog-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: blog-migrate
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: blog-seed
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-backup
      ports:
        - port: 5432
          protocol: TCP
