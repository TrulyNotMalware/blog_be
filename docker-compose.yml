services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    # PG 18+ stores data under /var/lib/postgresql/<version>/...
    # Mount the parent so the image default PGDATA works.
    volumes:
      - blog_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  blog_pg:
